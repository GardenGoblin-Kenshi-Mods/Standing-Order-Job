name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check scaffold files
        run: |
          test -f meitou.json
          test -f src/StandingOrderJob.csproj
          test -x tools/package.sh
          test -x tools/stage.sh
          test -x tools/archive-package.sh
          python3 -m json.tool meitou.json >/dev/null

  package:
    needs: layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve MeitouClient ref
        id: meitou
        run: |
          ref="${{ vars.MEITOU_CLIENT_REF }}"
          if [[ -z "$ref" && -f .github/meitou-client.ref ]]; then
            ref="$(tr -d '[:space:]' < .github/meitou-client.ref)"
          fi
          if [[ -z "$ref" ]]; then
            echo "::error::Set vars.MEITOU_CLIENT_REF or add .github/meitou-client.ref"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout MeitouClient
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.MEITOU_CLIENT_REPOSITORY || 'VlcekM/MeitouClient' }}
          ref: ${{ steps.meitou.outputs.ref }}
          path: .ci/MeitouClient

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Package
        env:
          MEITOU_CLIENT_ROOT: ${{ github.workspace }}/.ci/MeitouClient
        run: |
          ./tools/package.sh
          archive="$(./tools/archive-package.sh)"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: StandingOrderJob-package
          path: ${{ env.archive }}
          if-no-files-found: error
