name: release-please

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to recover (blank runs Release Please)"
        type: string
        required: false
      publish_nexus:
        description: "Also publish recovered release to Nexus"
        type: boolean
        default: false
      publish_steam:
        description: "Also publish recovered release to Steam Workshop"
        type: boolean
        default: false

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        if: inputs.release_tag == ''
        id: release
        with:
          # Optional override if GITHUB_TOKEN is restricted again.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  resolve-release:
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve release to package
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        run: |
          tag="$MANUAL_TAG"
          if [[ -z "$tag" && "$RELEASE_CREATED" == "true" ]]; then
            tag="$CREATED_TAG"
          fi
          if [[ -z "$tag" ]]; then
            exit 0
          fi
          if [[ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')" != "$tag" ]]; then
            echo "::error::Expected an existing published release for $tag"
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

  package-release:
    needs: resolve-release
    if: needs.resolve-release.outputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.tag_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      - name: Package (sandboxed Nix build)
        id: package
        run: |
          ./tools/package.sh
          ./tools/check-binlog-secrets.sh out/StandingOrderJob.binlog
          version="$(tr -d '[:space:]' < version.txt)"
          archive="out/StandingOrderJob-${version}.zip"
          dll="out/StandingOrderJob/StandingOrderJob.dll"
          python3 - "$archive" "$dll" <<'PY'
          import sys, zipfile
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1], "r") as zf:
              zip_dll = zf.read("StandingOrderJob/StandingOrderJob.dll")
          assert zip_dll == Path(sys.argv[2]).read_bytes(), "DLL inside ZIP differs from standalone DLL!"
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "dll=$dll" >> "$GITHUB_OUTPUT"

      # Public repositories support attestations on free plans; private
      # repositories require an eligible plan and explicit opt-in.
      - name: Attest compiled DLL
        id: attest_dll
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.dll }}

      - name: Attest distribution ZIP
        id: attest_zip
        if: github.event.repository.private == false || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload release assets and provenance notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-release.outputs.tag_name }}
          VERSION: ${{ steps.package.outputs.version }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTESTED: ${{ steps.attest_dll.outcome == 'success' && steps.attest_zip.outcome == 'success' }}
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          [[ "v$VERSION" == "$TAG" ]] || { echo "::error::Version does not match tag"; exit 1; }
          gh release upload "$TAG" \
            "out/StandingOrderJob-${VERSION}.zip" \
            "out/StandingOrderJob-${VERSION}.zip.sha256" \
            "out/StandingOrderJob-${VERSION}.contents.sha256" \
            "out/StandingOrderJob.binlog" \
            --clobber

          body="$(gh release view "$TAG" --json body -q .body | python3 .github/scripts/release_artifact.py prepare-release-body --meitou-json out/StandingOrderJob/meitou.json)"

          {
            printf '%s\n\n' "$body"
            printf '### Build provenance & checksums\n\n'
            printf -- '- **Originating CI run:** https://github.com/%s/actions/runs/%s\n' "$REPO" "$RUN_ID"
            printf -- '- **Source commit:** https://github.com/%s/commit/%s (`%s`)\n' "$REPO" "$COMMIT_SHA" "$COMMIT_SHA"
            printf -- '- **Release tag:** https://github.com/%s/releases/tag/%s\n' "$REPO" "$TAG"
            printf -- '- **Verification instructions:** https://github.com/%s/blob/%s/README.md#build-transparency--verification\n' "$REPO" "$TAG"
            if [[ "$ATTESTED" == "true" ]]; then
            printf -- '- **Attestations & build log:** Both `StandingOrderJob-%s.zip` and the extracted `StandingOrderJob/StandingOrderJob.dll` have GitHub build-provenance attestations; `StandingOrderJob.binlog`, `StandingOrderJob-%s.zip.sha256`, and `StandingOrderJob-%s.contents.sha256` are attached.\n\n' "$VERSION" "$VERSION" "$VERSION"
            else
              printf -- '- **Attestations:** Not generated (repository visibility or plan configuration).\n'
              printf -- '- **Build log & checksums:** `StandingOrderJob.binlog`, `StandingOrderJob-%s.zip.sha256`, and `StandingOrderJob-%s.contents.sha256` are attached.\n\n' "$VERSION" "$VERSION"
            fi
            ./tools/package-checksums.sh
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  publish-nexus:
    needs: [resolve-release, package-release]
    if: needs.package-release.result == 'success' && (inputs.release_tag == '' || inputs.publish_nexus == true)
    uses: ./.github/workflows/publish-nexus.yml
    with:
      release_tag: ${{ needs.resolve-release.outputs.tag_name }}
      dry_run: false
    secrets: inherit

  publish-steam:
    needs: [resolve-release, package-release]
    if: needs.package-release.result == 'success' && (inputs.release_tag == '' || inputs.publish_steam == true)
    uses: ./.github/workflows/publish-steam.yml
    with:
      release_tag: ${{ needs.resolve-release.outputs.tag_name }}
      dry_run: false
    secrets: inherit
