readme_features: '- Adds `Stand Here` to a player character''s hold-right-click menu
    when they are selected and non-animal.

    - Unshifted `Stand Here` orders eligible selected characters to the clicked character''s
    position once without altering existing jobs.

    - Shift+`Stand Here` adds or updates a permanent `Stand Here` job in-place (preserving
    job-list priority) with one standing coordinate per character.

    - Characters walk to their assigned point and hold within `1.5m` horizontal distance
    until a higher-priority task or player order interrupts them.

    - Combat, incapacity, carrying, and other standard interruptions use normal task
    precedence; eligible characters resume standing afterward (an active in-range `Stand
    Here` blocks lower jobs below it).

    - Configurable maximum return distance in **Mods → Standing Order Job** (defaults
    to `652m` to match Meitou''s vanilla job range; set `0` for unlimited); out-of-range
    characters skip `Stand Here` without disabling `Jobs` or erasing their saved spot
    and resume automatically once back in range.

    - Respects the Jobs toggle, cleans up automatically when removed from the Jobs
    panel, and preserves assigned positions across zone unloads and save/load.

    '
